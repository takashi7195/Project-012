<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AIタカシの3連単予想</title>
    <link rel="stylesheet" href="style.css?ui=bg-v2-fixed">
    <link rel="stylesheet" href="ui-reference.css?ui=reference05">
</head>
<body class="reference-ui">
    <main class="site-stack" id="site-content">
    <section class="game-hero" aria-labelledby="site-title">
        <h1 id="site-title">AIタカシの3連単予想</h1>
        <div class="selectors">
            <select id="stadium-select" aria-label="会場">
                <option value="桐生">桐生</option>
                <option value="戸田">戸田</option>
                <option value="江戸川">江戸川</option>
                <option value="平和島">平和島</option>
                <option value="多摩川">多摩川</option>
                <option value="浜名湖">浜名湖</option>
                <option value="蒲郡">蒲郡</option>
                <option value="常滑">常滑</option>
                <option value="津">津</option>
                <option value="三国">三国</option>
                <option value="びわこ">びわこ</option>
                <option value="住之江">住之江</option>
                <option value="尼崎">尼崎</option>
                <option value="鳴門">鳴門</option>
                <option value="丸亀">丸亀</option>
                <option value="児島">児島</option>
                <option value="宮島">宮島</option>
                <option value="徳山">徳山</option>
                <option value="下関">下関</option>
                <option value="若松">若松</option>
                <option value="芦屋">芦屋</option>
                <option value="福岡">福岡</option>
                <option value="唐津">唐津</option>
                <option value="大村">大村</option>
            </select>
            <select id="race-select" aria-label="レース">
                <option value="1R">1R</option>
                <option value="2R">2R</option>
                <option value="3R">3R</option>
                <option value="4R">4R</option>
                <option value="5R">5R</option>
                <option value="6R">6R</option>
                <option value="7R">7R</option>
                <option value="8R">8R</option>
                <option value="9R">9R</option>
                <option value="10R">10R</option>
                <option value="11R">11R</option>
                <option value="12R">12R</option>
            </select>
        </div>

        <div class="container game-panel">
        <div class="favorite-label">◎ 本命</div>
        <div id="results" aria-label="予想結果">
            <div class="slot" id="slot-1"><div class="reel"></div></div>
            <div class="slot" id="slot-2"><div class="reel"></div></div>
            <div class="slot" id="slot-3"><div class="reel"></div></div>
        </div>

        <button id="start-btn">START</button>
        <div class="version">v0.1.12</div>
    </div>
    <div class="secondary-predictions" aria-label="対抗と穴の予想">
        <div class="prediction-row">
            <span class="prediction-label">○ 対抗</span>
            <span class="prediction-combination" data-prediction="counter" aria-label="対抗予想">
                <span class="prediction-boat bg-1">1</span><span class="prediction-separator">-</span><span class="prediction-boat bg-3">3</span><span class="prediction-separator">-</span><span class="prediction-boat bg-2">2</span>
            </span>
        </div>
        <div class="prediction-row">
            <span class="prediction-label">▲ 穴</span>
            <span class="prediction-combination" data-prediction="longshot" aria-label="穴予想">
                <span class="prediction-boat bg-4">4</span><span class="prediction-separator">-</span><span class="prediction-boat bg-1">1</span><span class="prediction-separator">-</span><span class="prediction-boat bg-2">2</span>
            </span>
        </div>
    </div>
    <section class="race-development" aria-labelledby="race-development-title">
        <h2 id="race-development-title">レース展開</h2>
        <p>1号艇が先手を取り、2号艇が差して続く展開を想定。<br>4号艇はスタート次第でまくり差し。</p>
    </section>
    </section>
    <section class="comments-section" aria-labelledby="comments-title">
        <div class="comment-heading">
            <h2 class="comment-title" id="comments-title">コメント</h2>
            <button class="comment-open" id="comment-open" type="button" aria-haspopup="dialog" aria-controls="comment-composer" aria-expanded="false">コメントを書く</button>
        </div>
        <p id="comment-notice" class="comment-notice" role="status" aria-live="polite"></p>
        <div class="comments-list" id="comments-list" aria-label="コメント一覧"></div>
        <div class="comments-loading" id="comments-loading" role="status" aria-live="polite" hidden>loading...</div>
        <p class="comments-load-status" id="comments-load-status" role="status" aria-live="polite"></p>
        <button class="comments-retry" id="comments-retry" type="button" hidden>再読み込み</button>
        <div class="comments-sentinel" id="comments-sentinel" aria-hidden="true"></div>
    </section>
    </main>
    <div class="avatar-dialog" id="avatar-dialog" hidden>
        <div class="avatar-dialog-backdrop" data-avatar-close="true"></div>
        <section class="avatar-dialog-card" role="dialog" aria-modal="true" aria-labelledby="avatar-dialog-title">
            <button class="avatar-dialog-close" id="avatar-dialog-close" type="button" aria-label="AIタカシの画像を閉じる">×</button>
            <img id="avatar-dialog-image" src="ai-takashi-avatar.png" alt="AIタカシ" width="220" height="220">
            <p id="avatar-dialog-title">AIタカシ</p>
        </section>
    </div>
    <div class="composer-layer" id="comment-composer" hidden>
        <div class="composer-backdrop" aria-hidden="true"></div>
        <section class="composer-sheet" role="dialog" aria-modal="true" aria-labelledby="composer-title">
            <div class="composer-handle" aria-hidden="true"></div>
            <div class="comment-form-header">
                <h2 id="composer-title">コメントを書く</h2>
                <button class="comment-close" id="comment-close" type="button" aria-label="コメント入力を閉じる">×</button>
            </div>
            <form class="comment-form" id="comment-form">
                <div class="composer-fields">
                    <label class="visually-hidden" for="nickname">ニックネーム（任意）</label>
                    <input class="nickname-input" id="nickname" name="nickname" type="text" placeholder="ニックネーム（任意）" maxlength="40" autocomplete="nickname">
                    <label class="visually-hidden" for="comment">コメント</label>
                    <textarea class="comment-input" id="comment" name="comment" rows="3" maxlength="300" placeholder="レースの感想をどうぞ" required aria-describedby="composer-privacy"></textarea>
                    <p class="privacy-hint" id="composer-privacy">個人情報は入力しないでください　<a href="privacy.html" target="_blank" rel="noopener">利用案内</a></p>
                    <p class="comment-status" id="comment-status" role="status" aria-live="polite"></p>
                </div>
                <div class="composer-footer">
                    <span class="character-count" id="comment-count" aria-live="off">0/300</span>
                    <button class="post-button" id="post-button" type="submit">送信</button>
                </div>
            </form>
        </section>
    </div>
    <script src="script.js"></script>
    <script src="comment-safety.js?api=live03"></script>
    <script src="comments.js?api=reference04"></script>
</body>
</html>
